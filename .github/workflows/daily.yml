name: daily-radar

on:
  schedule:
    - cron: "0 6 * * *"   # 06:00 UTC = 07:00 CET
  workflow_dispatch:
    inputs:
      dry_run:
        description: "Dry run (no HubSpot or Slack writes)"
        type: boolean
        default: false

concurrency:
  group: daily-radar
  cancel-in-progress: false

jobs:
  radar:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
      - run: pip install -r requirements.txt
      - run: python -m pytest -q
      # SQLite state (seen postings, caches, run log) survives between runs. The cache key is unique
      # per run and restore-keys picks the latest one, which is the usual way to roll a cache forward.
      - uses: actions/cache@v4
        with:
          path: radar.db
          key: radar-db-${{ github.run_id }}
          restore-keys: radar-db-
      - name: Run the pipeline
        env:
          ADZUNA_APP_ID: ${{ secrets.ADZUNA_APP_ID }}
          ADZUNA_APP_KEY: ${{ secrets.ADZUNA_APP_KEY }}
          LLM_API_KEY: ${{ secrets.LLM_API_KEY }}
          LLM_MODEL: ${{ secrets.LLM_MODEL }}
          LLM_BASE_URL: ${{ secrets.LLM_BASE_URL }}
          LLM_MIN_INTERVAL: "7"
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          HUBSPOT_TOKEN: ${{ secrets.HUBSPOT_TOKEN }}
          HUBSPOT_PORTAL_ID: ${{ secrets.HUBSPOT_PORTAL_ID }}
          SLACK_DIGEST_WEBHOOK: ${{ secrets.SLACK_DIGEST_WEBHOOK }}
          SLACK_ERROR_WEBHOOK: ${{ secrets.SLACK_ERROR_WEBHOOK }}
          OWNERS_SMB: ${{ secrets.OWNERS_SMB }}
          OWNERS_MID_MARKET: ${{ secrets.OWNERS_MID_MARKET }}
          OWNER_DEFAULT: ${{ secrets.OWNER_DEFAULT }}
        run: python -m radar.main ${{ inputs.dry_run && '--dry-run' || '' }}
